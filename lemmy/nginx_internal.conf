worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS, so upstreams are re-resolved as containers are
    # replaced instead of pinning a stale IP. Use 10.89.0.1 on Podman/RedHat hosts.
    resolver 127.0.0.11 valid=5s;

    # Recover the real client IP from the private ranges Docker uses.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # ActivityPub discovery is content-negotiated. By matching the request method
    # and Accept header together — "GET:application/activity+json" vs
    # "GET:text/html" — the same URL serves people and the fediverse.
    map "$request_method:$http_accept" $proxpass {
        default "http://lemmy-ui:1234";

        # Profile and site discovery from Mastodon and other instances.
        "~^(?:GET|HEAD):.*?application\/(?:activity|ld)\+json" "http://lemmy:8536";

        # Every write verb goes to the backend; negate the read pattern above
        # rather than listing POST/PUT/DELETE/PATCH individually.
        "~^(?!(GET|HEAD)).*:" "http://lemmy:8536";
    }

    server {
        set $lemmy_ui "lemmy-ui:1234";
        set $lemmy "lemmy:8536";

        # Internal-only; the public port is published in docker-compose.yml.
        listen 1236;
        listen 8536;

        server_name localhost;
        server_tokens off;

        # Upload limit, relevant for pictrs
        client_max_body_size 20M;

        # Federation signatures cover the Host header — pass it through unmodified.
        include proxy_params;

        location / {
            proxy_pass $proxpass;
            rewrite ^(.+)/+$ $1 permanent;
        }

        location = /.well-known/security.txt {
            proxy_pass "http://$lemmy_ui";
        }

        location ~ ^/(api|pictrs|feeds|nodeinfo|.well-known|version|sitemap.xml) {
            proxy_pass "http://$lemmy";
            include proxy_params;
        }
    }
}
