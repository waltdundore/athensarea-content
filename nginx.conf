server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The repository root is the document root, so .env and .lemmy/ sit beside the
    # site and would otherwise be downloadable. 404, not 403, to avoid confirming
    # which paths exist.
    location ~ /\.(?!well-known) { return 404; }

    # Same reason for the non-site files that live at the repo root or in the
    # proxy/ and lemmy/ source directories. Regex locations are matched in
    # config order, so this must stay above the static-asset regex below.
    location ~ ^/(proxy|lemmy|nginx\.conf|Makefile|docker-compose\.yml|README\.md|LICENSE|SPEC\.md|AUDIT\.md)(/|$) { return 404; }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    # Proxy /api/rss to the Node.js container
    location /api/ {
        proxy_pass         http://proxy:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Cache CSS/JS/images aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
