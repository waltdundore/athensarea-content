services:

  # Static file server (Nginx)
  web:
    image: nginx:alpine
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # RSS proxy
  proxy:
    build: ./proxy
    environment:
      PORT: "3001"
      RATE_LIMIT_MAX: "60"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
