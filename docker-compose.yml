# athensarea.net — the whole site in one stack.
#
#   make up       create .env, render config, start everything
#   make status   what is running right now
#   make logs     follow the logs
#
# Settings live here, with the defaults a production deployment uses. Only real
# secrets are read from .env (see .env.example), which is git-ignored; on the
# deploy host it is written from GitHub Actions Secrets by
# .github/workflows/deploy.yml. Nothing secret is ever committed.
#
# Port notes for this shared host: :80/:443/:8080 belong to an unrelated reverse
# proxy and :5432/:3001 belong to other stacks. This file publishes only :8888
# (site) and ${LEMMY_HTTP_PORT} (community, default 10633) and joins no network
# it does not own.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:

  # ============================ Site ============================

  # Static file server (Nginx)
  web:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy
    restart: unless-stopped
    logging: *default-logging

  # RSS proxy + Classifieds API
  proxy:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./proxy:/app
      - listings-data:/data
    command: sh -c "npm install --omit=dev --silent && node server.js"
    environment:
      PORT: "3001"
      DB_PATH: "/data/listings.db"
      TURNSTILE_SECRET:   "${TURNSTILE_SECRET:-}"     # Cloudflare Turnstile secret key
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"   # Cloudflare Turnstile public site key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ===================== Community (Lemmy) =====================
  # https://join-lemmy.org/docs/administration/install_docker.html
  #
  # Lemmy speaks ActivityPub, so it has to answer at the root of its own origin
  # with the public Host header intact. It therefore gets its own published port
  # instead of a sub-path of the site. In production a TLS reverse proxy in front
  # of ${LEMMY_HTTP_PORT} is the only extra piece.

  # Routes ActivityPub traffic to the Lemmy backend and everything else to the UI.
  lemmy-proxy:
    image: nginx:1-alpine
    ports:
      - "${LEMMY_HTTP_PORT:-10633}:8536"
    volumes:
      - ./lemmy/nginx_internal.conf:/etc/nginx/nginx.conf:ro
      - ./lemmy/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - lemmy
      - lemmy-ui
      - lemmy-pictrs
    restart: unless-stopped
    logging: *default-logging

  lemmy:
    image: dessalines/lemmy:0.19.20
    hostname: lemmy
    environment:
      RUST_LOG: "warn"
      LEMMY_CONFIG_LOCATION: "/config/config.hjson"
    volumes:
      # Rendered by `make config` from lemmy/config.hjson.template. Never committed.
      - ./.lemmy/config.hjson:/config/config.hjson:ro
    depends_on:
      lemmy-db:
        condition: service_healthy
      lemmy-pictrs:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.20
    hostname: lemmy-ui
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: "lemmy:8536"
      LEMMY_UI_LEMMY_EXTERNAL_HOST: "${LEMMY_DOMAIN:-social.athensarea.net}"
      LEMMY_UI_HTTPS: "${LEMMY_UI_HTTPS:-true}"
    depends_on:
      - lemmy
    restart: unless-stopped
    logging: *default-logging

  # Image/link hosting for Lemmy. Runs unprivileged; the named volume inherits
  # uid 991 from the image, so no host-side chown is needed.
  lemmy-pictrs:
    image: asonix/pictrs:0.5.24
    hostname: lemmy-pictrs
    user: "991:991"
    environment:
      PICTRS__SERVER__API_KEY: "${LEMMY_PICTRS_API_KEY}"
      PICTRS__MEDIA__VIDEO__VIDEO_CODEC: "vp9"
      PICTRS__MEDIA__ANIMATION__MAX_WIDTH: "256"
      PICTRS__MEDIA__ANIMATION__MAX_HEIGHT: "256"
      PICTRS__MEDIA__ANIMATION__MAX_FRAME_COUNT: "400"
    volumes:
      - lemmy-pictrs-data:/mnt
    restart: unless-stopped
    logging: *default-logging

  lemmy-db:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    hostname: lemmy-db
    environment:
      POSTGRES_USER: "lemmy"
      POSTGRES_PASSWORD: "${LEMMY_DB_PASSWORD}"
      POSTGRES_DB: "lemmy"
    shm_size: 1g
    volumes:
      - lemmy-db-data:/var/lib/postgresql
    restart: unless-stopped
    logging: *default-logging

volumes:
  listings-data:
  lemmy-db-data:
  lemmy-pictrs-data:
